[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mono-urbano"
version = "0.1.0"
description = "Pipeline de contenido para Instagram protagonizado por un macaco urbano"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
  "pillow>=10",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "typer>=0.12",
]

[project.optional-dependencies]
publish = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mono = "mono.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
