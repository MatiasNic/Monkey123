name: tienda_camisetas
description: >-
  Retro football shirt shop / lounge in Buenos Aires: dark olive walls, six framed
  vintage national-team jerseys high on the wall, wooden shelf with Maradona tees,
  mugs and photos, exposed brick on the left, two beige damask sofas and an armchair
  around a carved wooden coffee table on a Persian rug, parquet floor, old trunks
  with striped jerseys and bowler hats on the right.
keep: [wall of framed jerseys, wooden shelf, damask sofas, carved coffee table, Persian rug, warm tungsten light, camera height and perspective]
action_ideas:
  - watching a match on a small TV
  - checking the laptop on the sofa
  - looking up at the framed jerseys
  - taking a photo of a jersey with a film camera
  - reading a football magazine
  - napping on the sofa
  - sorting sticker album cards
  - trying on a vintage jersey in front of the trunk
