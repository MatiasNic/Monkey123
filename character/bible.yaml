# Biblia del personaje — fuente única de verdad.
# Todo prompt de imagen se construye a partir de este archivo (src/mono/prompting/builder.py).

identity:
  species: "real adult macaque monkey (Old World monkey)"
  description: >-
    The same ADULT macaque in every image, exactly as in the reference photos:
    mature face with a tan-brown bare face, darker skin around the eyes, deep
    fine wrinkles, short muzzle, calm half-closed amber-brown eyes, small ears
    close to the head; warm brown fur (natural brown, never green, olive or
    grey-green), dense and slightly tousled; adult body with human posture,
    sitting and standing like a grown man, wearing normal adult clothes that fit
    (as in the references). Dark leathery hands with long fingers.
  must_keep:
    - an adult macaque, never a baby, infant or juvenile
    - facial features, muzzle shape, wrinkles and eye color identical to the reference images
    - warm brown fur color and texture; never greenish
    - sits, stands and dresses like a relaxed adult person, clothes that fit, as in the references
  never:
    - baby, infant or juvenile monkey, big childish eyes, oversized clothes on a tiny body
    - chimpanzee, gorilla, orangutan or any great ape
    - cartoon, 3D render, anime, plush toy, mascot or costume
    - professional campaign pose, looking straight into the lens like a model
    - visible text overlays, watermarks, logos added on top of the image
  personality: "calm, cool, laid-back, urban, slightly ironic; never posing"
  reference_dir: character/reference
  # Recortes de las referencias (solo el mono, sin el balcón): son las que recibe el generador,
  # así ve la cara grande y no copia el fondo. El QC sigue comparando contra reference_dir.
  generator_refs_dir: character/reference_crops
  style_refs_dir: character/style_refs   # solo encuadre/estilo, NUNCA identidad

# Tono del contenido: cada foto tiene que poder subirse tal cual a Instagram.
content:
  tone: >-
    Calm, everyday urban life that anyone recognises: commuting, a coffee, a walk,
    errands, work, a quiet moment at home or in the city. Relaxed, warm, a little
    ironic. Clean and well kept, never sordid.
  never:
    - drugs, smoking, vaping, alcohol or anything that could be read as such
    - ambiguous white objects, powders, cloths or bags held near the face
    - crouching or hiding in corners, looking sick, dirty, sad, lost or neglected
    - violence, danger, sexual content, politics, religion, real brands as the focus

axes:
  # Ejes que el motor de variedad rota. La ideación debe variar todos a la vez.
  activity: [reading the newspaper, working on a laptop, scrolling the phone, video call, eating breakfast, drinking coffee, drinking mate, waiting for the bus, watching TV, grocery shopping, trying on clothes, browsing records, taking a photo, commuting, walking the street, buying fruit at a verdulería, cooking, writing notes, people watching, riding a bike, watering plants, reading a book]
  pose: [sitting, reclining on a sofa, sitting with lower body partly hidden, leaning against something, seen from behind, profile, sitting on a bench, on an armchair, on a stool, at a table, looking out a window, standing in line, walking]
  # Sin "wide establishing": el modelo liviano casi nunca deja al mono chico en el cuadro.
  camera_distance: [medium wide, medium, medium close-up, close portrait]
  expression: [absorbed, bored, mildly surprised, content, sleepy, skeptical, focused, amused, distracted, serene]
  gaze: [at object in hands, out of frame left, out of frame right, down, out the window, at a screen, at another person, eyes closed, toward camera but unaware]
  lighting: [bright morning sun, soft window light, golden hour, overcast daylight, open shade on a sunny day, warm interior daylight, late afternoon sun]
  outfit: [white tee and baggy jeans, bucket hat and tee, varsity jacket and cargo pants, quilted jacket and grey jeans, oversized hoodie, linen shirt and shorts, wool overcoat and scarf, cheap suit too big, tracksuit, knitted sweater, raincoat, pajamas and slippers]
  accessories: [wired earphones, wireless earbuds, cap backwards, bucket hat, tote bag, film camera, iced coffee, paper bag of groceries, backpack, sunglasses, headphones, none]
  location: [Buenos Aires balcony, Buenos Aires café, Palermo street corner, subte car, colectivo seat, laundromat, record store, bookstore, diner, airport gate, hotel corridor, rooftop terrace, plaza bench, kiosco, used camera shop, Manhattan street corner, Madrid metro, Tokyo konbini, apartment living room, barbershop]

situations_seed:
  - reading the newspaper on a sunny Buenos Aires balcony full of plants
  - watering the balcony plants in the morning
  - pointing at medialunas in a bright bakery while choosing
  - working on a laptop in a café by the window
  - sorting football stickers in a retro football shirt shop
  - drinking mate on a plaza bench in the sun
  - buying fruit at a verdulería
  - waiting at a bus stop with earphones
  - browsing vinyl records in a record store
  - reading a book on a sofa by the window

photography:
  always: "real, clean and sharp photo taken with a modern phone or mirrorless camera, like the reference images; natural daylight, true-to-life colors, bright and airy, believable depth of field, everyday candid moment"
  anatomy: "anatomically correct: exactly two arms, two hands, two legs and two feet; five digits per hand and per foot; no extra, duplicated or merged limbs"
  avoid: "baby or juvenile monkey, film grain, heavy noise, vignette, black and white, direct flash, motion blur, washed-out or yellow color cast, mirrors, reflections, extra limbs, extra feet, extra hands, duplicated body parts, green or olive tinted fur, chimpanzee face, human face, cinematic look, HDR, advertising polish, perfect symmetry, plastic skin, CGI, 3D render, AI-generated look, oversaturated colors, text, watermark, collage, grid, split image"

# Catálogo de cámaras/looks: parámetros de prompt + parámetros de post-proceso.
camera_looks:
  # Todos limpios y nítidos, como las referencias. El post-proceso es mínimo: solo quita el brillo "IA".
  iphone_daylight:
    prompt: "modern iPhone photo in daylight, sharp, natural colors, slightly casual framing"
    post: {grain: 0.008, grain_size: 1.0, contrast: 0.02, saturation: 1.0, warmth: 0.01, vignette: 0.0, chroma_ab: 0.0, halation: 0.0, flash: 0.0, softness: 0.0}
  iphone_golden_hour:
    prompt: "modern iPhone photo at golden hour, warm low sun, long soft shadows, sharp, natural colors"
    post: {grain: 0.008, grain_size: 1.0, contrast: 0.03, saturation: 1.0, warmth: 0.02, vignette: 0.0, chroma_ab: 0.0, halation: 0.0, flash: 0.0, softness: 0.0}
  mirrorless_35mm:
    prompt: "photo on a mirrorless camera with a 35mm lens, natural light, crisp detail, gentle background blur"
    post: {grain: 0.01, grain_size: 1.0, contrast: 0.03, saturation: 0.98, warmth: 0.01, vignette: 0.02, chroma_ab: 0.0, halation: 0.0, flash: 0.0, softness: 0.0}
  window_light_interior:
    prompt: "indoor photo with soft natural window light, clean and bright, sharp, true-to-life colors"
    post: {grain: 0.01, grain_size: 1.0, contrast: 0.02, saturation: 0.98, warmth: 0.02, vignette: 0.0, chroma_ab: 0.0, halation: 0.0, flash: 0.0, softness: 0.0}
  street_overcast:
    prompt: "candid street photo on an overcast day, even soft light, sharp, muted natural colors"
    post: {grain: 0.01, grain_size: 1.0, contrast: 0.03, saturation: 0.97, warmth: 0.0, vignette: 0.0, chroma_ab: 0.0, halation: 0.0, flash: 0.0, softness: 0.0}

formats:
  feed: {size: [1080, 1350], ratio: "4:5"}
  carousel: {size: [1080, 1350], ratio: "4:5", min_items: 2, max_items: 10}
  story: {size: [1080, 1920], ratio: "9:16"}
  reel: {size: [1080, 1920], ratio: "9:16", fps: 30, seconds_per_image: 2.5}
