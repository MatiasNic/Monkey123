name: generate
# Genera tandas (ideas → imágenes → QC → post-proceso → captions) y abre UN PR por corrida para aprobar.
# Mergear el PR = aprobar (ver approve.yml). Borrar un .jpg en el PR = descartar esa pieza.
on:
  schedule:
    - cron: "0 12 * * 0,3"   # dom y mié 12:00 UTC (09:00 Buenos Aires); qué se genera: config.yaml → generate_plan
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cantidad de piezas"
        default: "8"
      formato:
        description: "Formato"
        type: choice
        options: [feed, carousel, story, reel]
        default: feed
      escena:
        description: "Carpeta en scenes/ (opcional)"
        default: ""
      tema:
        description: "Tema o pista (opcional)"
        default: ""
      provider:
        description: "Proveedor de imagen"
        type: choice
        options: [cloudflare, manual, mock]
        default: cloudflare

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias y Claude Code
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code

      - name: Plan del día
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_FORMAT: ${{ inputs.formato }}
          IN_COUNT: ${{ inputs.cantidad }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mono plan --format "$IN_FORMAT" --count "$IN_COUNT"
          else
            mono plan
          fi

      - name: Verificar credenciales
        if: steps.plan.outputs.has_work == 'true'
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_CF: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
          IN_PROVIDER: ${{ inputs.provider }}
        run: |
          provider="${IN_PROVIDER:-$(mono config image.provider)}"
          missing=()
          [ "$HAS_CLAUDE" = "true" ] || missing+=("CLAUDE_CODE_OAUTH_TOKEN (corré 'claude setup-token' en tu compu)")
          if [ "$provider" = "cloudflare" ] && [ "$HAS_CF" != "true" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_TOKEN (Cloudflare → Workers AI → Use REST API)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Faltan secrets::Cargalos en Settings → Secrets and variables → Actions"
            for m in "${missing[@]}"; do echo "::error::Falta el secret $m"; done
            exit 1
          fi
          echo "Credenciales OK (proveedor: $provider)"

      - name: Generar tandas
        id: gen
        if: steps.plan.outputs.has_work == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAN: ${{ steps.plan.outputs.plan }}
          IN_SCENE: ${{ inputs.escena }}
          IN_THEME: ${{ inputs.tema }}
          IN_PROVIDER: ${{ inputs.provider }}
          BRANCH: generate/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          extra=()
          [ -n "${IN_SCENE:-}" ] && extra+=(--scene "$IN_SCENE")
          [ -n "${IN_THEME:-}" ] && extra+=(--theme "$IN_THEME")
          [ -n "${IN_PROVIDER:-}" ] && extra+=(--provider "$IN_PROVIDER")
          ids=()
          for row in $(echo "$PLAN" | jq -c '.[]'); do
            fmt=$(echo "$row" | jq -r .format); n=$(echo "$row" | jq -r .count)
            rc=0; mono generate -n "$n" -f "$fmt" "${extra[@]}" || rc=$?
            if [ "$rc" = "3" ]; then
              # Cuota agotada: no se sigue, pero las tandas que ya salieron se conservan y van al PR.
              echo "quota=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=Cuota de Cloudflare agotada::Se renueva a las 21:00 (Buenos Aires)."
              break
            fi
            [ "$rc" = "0" ] || exit "$rc"
            ids+=("$(grep '^batch_id=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)")
          done
          if [ ${#ids[@]} -eq 0 ]; then
            echo "::error::No se generó ninguna tanda (cuota de Cloudflare agotada)."
            exit 3
          fi
          {
            echo "Tandas generadas por \`generate.yml\` (run ${{ github.run_id }})."
            echo
            for id in "${ids[@]}"; do
              mono review "$id" --image-base "https://raw.githubusercontent.com/$REPO/$BRANCH"
              echo
            done
          } > "$RUNNER_TEMP/pr_body.md"
          echo "batches=${ids[*]}" >> "$GITHUB_OUTPUT"

      - name: Copiar a Google Drive
        timeout-minutes: 15
        if: always() && steps.gen.outputs.batches != ''
        continue-on-error: true
        env:
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_WEBHOOK_SECRET: ${{ secrets.DRIVE_WEBHOOK_SECRET }}
          BATCHES: ${{ steps.gen.outputs.batches }}
        run: |
          args=()
          for id in $BATCHES; do args+=(--batch "$id"); done
          mono drive-sync "${args[@]}"

      - name: Modo de aprobación
        id: mode
        run: mono config approval_mode

      - name: Abrir PR de aprobación
        id: pr
        if: steps.plan.outputs.has_work == 'true' && steps.mode.outputs.value != 'auto'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: generate/${{ github.run_id }}
          base: ${{ github.event.repository.default_branch }}
          title: "Tanda ${{ steps.gen.outputs.batches }}"
          body-path: ${{ runner.temp }}/pr_body.md
          commit-message: "Agregar tanda ${{ steps.gen.outputs.batches }}"
          add-paths: |
            drafts/**
            data/**
          labels: tanda

      # Modo auto: `mono generate` ya aprobó y encoló; se commitea directo a la rama por defecto, sin PR.
      - name: Commit directo (modo auto)
        id: direct
        if: steps.plan.outputs.has_work == 'true' && steps.mode.outputs.value == 'auto'
        env:
          BATCHES: ${{ steps.gen.outputs.batches }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet && exit 0
          git commit -m "Agregar y encolar tanda $BATCHES (modo auto)"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "url=${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Avisar tanda encolada (modo auto)
        if: steps.direct.outputs.url != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_URL: ${{ steps.direct.outputs.url }}
        run: mono notify --event batch_ready --title "Tanda encolada (modo auto)" --body "$COMMIT_URL"

      - name: Avisar tanda lista
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: mono notify --event batch_ready --title "Tanda lista para revisar" --body "$PR_URL"
      - name: Avisar si falló
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.gen.outputs.quota }}" = "true" ]; then
            body="Se agotó la cuota diaria gratis de Cloudflare. Se renueva a las 21:00 (Buenos Aires); volvé a correr generate después."
          else
            body="Revisá el run para ver el detalle."
          fi
          mono notify --event failure --title "generate.yml falló" --body "$body" \
          || gh issue create --title "generate.yml falló" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || true
