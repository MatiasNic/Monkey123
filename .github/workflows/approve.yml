name: approve
# Al mergear un PR de tanda: las piezas que siguen en drafts/ pasan a aprobadas y se agendan en data/queue.yaml.
on:
  push:
    branches: [main]
    paths: ["drafts/**"]
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install -e .
      - run: mono approve
      - name: Commit de la cola
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data drafts
          git diff --cached --quiet && exit 0
          git commit -m "Encolar piezas aprobadas"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Avisar si falló
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mono notify --event failure --title "approve.yml falló" \
            --body "Revisá el run para ver el detalle." \
          || gh issue create --title "approve.yml falló" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || true
